name: Bug report
description: Something did not work the way the documentation says it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Partial information is fine — file it even
        if you cannot fill in every field.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what it did instead of what you expected.
      placeholder: |
        I ran /k8s-triage on <issue-url> and ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: cc-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
      placeholder: "2.1.234"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Output of `claude plugin details k8s-contributor`, first line
      placeholder: "0.1.0"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: |
        Any error text, or the contents of a gate log under
        `.claude/k8s-contributor/state/<repo>/<issue>/evidence/`.
        This is automatically formatted as code.
      render: shell
